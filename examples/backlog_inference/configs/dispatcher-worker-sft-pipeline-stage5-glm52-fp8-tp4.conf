SERVER_ADDRESS_FILE=.dispatcher-server-sft-math-only-glm52-fp8-tp4
TASK=tasks.inference_task_think.InferenceTask
MODEL=/shared_silo/scratch/models/zai-org/GLM-5.2-FP8

LAUNCHER_IMG=/shared_silo/scratch/containers/vllm-openai-rocm-nightly-3f5a1e1733200760169ff31ebe60a271072b199e.sif
LAUNCHER_SINGULARITY_EXTRA_ARGS="--ipc --pid"

AITER_RUN_ID="${SLURM_JOB_ID:-manual}-${SLURM_ARRAY_TASK_ID:-0}-$(date +%s)-$$"
LAUNCHER_AITER_CONFIG_DIR="/tmp/${USER}/${AITER_RUN_ID}/glm52-aiter-configs"
mkdir -p "$LAUNCHER_AITER_CONFIG_DIR"

# Do not force AITER_JIT_DIR for GLM-5.2 with Jonathan's ROCm nightly image.
# The retained TP4 runs import module_aiter_core from the container's installed
# aiter package. Forcing a fresh JIT root makes AITER rebuild module_aiter_core
# and can hang in hipcc's rocm_agent_enumerator probe before vLLM starts.
unset AITER_JIT_DIR SINGULARITYENV_AITER_JIT_DIR APPTAINERENV_AITER_JIT_DIR
AITER_JIT_DIR_LOCAL=0

HIP_FORCE_DEV_KERNARG=1
HSA_FORCE_FINE_GRAIN_PCIE=1
VLLM_ROCM_USE_AITER=1
VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1

REQUEST_TIMEOUT=5000
STARTUP_TIMEOUT=20000
MAX_MODEL_LEN=65536
GPUS_PER_TASK=4
WORKERS=192

if [ -n "${SLURM_JOB_ID:-}" ] && [ -n "${SLURM_JOB_GPUS:-}" ]; then
  IFS=',' read -r -a _slurm_gpus <<< "$SLURM_JOB_GPUS"
  if [ "${#_slurm_gpus[@]}" -ne "$GPUS_PER_TASK" ]; then
    echo "[ERROR] Expected $GPUS_PER_TASK allocated GPUs, got ${#_slurm_gpus[@]}: SLURM_JOB_GPUS=$SLURM_JOB_GPUS" >&2
    exit 1
  fi
fi

# Slurm's GPU cgroup presents the allocated devices as the process-visible GPU
# set. Do not pass physical IDs like 4,5,6,7 into HIP_VISIBLE_DEVICES; vLLM sees
# the logical in-cgroup device ordinals. This matches the retained GLM TP4 runs.
HIP_VISIBLE_DEVICES="${HIP_VISIBLE_DEVICES:-$(seq -s, 0 $((GPUS_PER_TASK - 1)))}"

VLLM_EXTRA_ARGS="--dtype auto --gpu-memory-utilization 0.95 --max-num-seqs 96 --max-num-batched-tokens 8192 --linear-backend aiter --moe-backend aiter --kv-cache-dtype fp8_e4m3 --generation-config vllm --speculative-config.method mtp --speculative-config.num_speculative_tokens 5 --cudagraph-capture-sizes 1 2 4 8 16 24 32 48 64 80 96 --no-enable-prefix-caching"
